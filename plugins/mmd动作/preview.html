<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <!--
    CSP 说明：
      • script-src 只允许 'self' —— 本页面**不写内联脚本**，
        所有逻辑都在 viewer.mjs 里（由主程序动态 import）。
      • connect-src 必须放行 asset: —— viewer 要用 fetch 读
        插件目录内的 _runtime/settings.json 与 VMD 文件头。
    本页面不刻意声明 <title>：窗口标题由主程序按「插件名 + 文件名」设置。
  -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self' asset:; img-src 'self' asset: data: blob:; media-src 'self' asset: blob:; connect-src 'self' asset:; style-src 'unsafe-inline'; script-src 'self'" />
  <!-- 独立预览窗口的样式由插件目录内的本文件定义 -->
  <style>
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
      background: #1e1f24; color: #e2e4e8;
      font-family: "Microsoft YaHei", "Segoe UI", system-ui, sans-serif;
    }
    /* 内容容器：宿主给的空盒子；canvas / audio 由 viewer 自行创建并塞进来 */
    #host-content { width: 100%; height: 100%; display: block; outline: none; }

    .host-title {
      position: fixed; top: 12px; left: 16px; z-index: 10; pointer-events: none;
      font-size: 13px; font-weight: 600; letter-spacing: .4px; color: #a78bfa;
      text-shadow: 0 1px 4px rgba(0, 0, 0, .7);
    }
    .host-sub {
      position: fixed; top: 31px; left: 16px; z-index: 10; pointer-events: none;
      font-size: 11px; color: #8b93a1; text-shadow: 0 1px 4px rgba(0, 0, 0, .7);
    }
    .host-sub.loaded { display: none; }
    .host-tips {
      position: fixed; right: 16px; bottom: 12px; z-index: 10; pointer-events: none;
      font-size: 11px; color: #6f7681; text-shadow: 0 1px 4px rgba(0, 0, 0, .7);
    }

    /* ── 居中提示块（缺模型 / 加载失败） ─────────────── */
    #viewer-hint {
      position: fixed; inset: 0; z-index: 30; display: none;
      align-items: center; justify-content: center;
      background: rgba(20, 21, 25, .82); backdrop-filter: blur(2px);
    }
    #viewer-hint .box {
      max-width: min(560px, 84vw); padding: 22px 26px;
      background: #24262c; border: 1px solid #34363e; border-radius: 10px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, .5);
    }
    #viewer-hint-title { font-size: 15px; font-weight: 600; color: #a78bfa; margin-bottom: 10px; }
    #viewer-hint-body { font-size: 13px; line-height: 1.7; color: #b9bec8; white-space: pre-wrap; }

    /* ── 3D 播放控制条 ──────────────────────────────── */
    #playbar {
      position: fixed; left: 50%; transform: translateX(-50%); bottom: 18px; z-index: 20;
      display: none; align-items: center; gap: 10px;
      padding: 8px 14px; border-radius: 999px;
      background: rgba(40, 42, 48, .9); border: 1px solid rgba(255, 255, 255, .14);
      backdrop-filter: blur(8px);
    }
    #playbar button {
      width: 30px; height: 30px; border-radius: 50%; cursor: pointer;
      background: #a78bfa; border: none; color: #1e1f24;
      font-size: 12px; line-height: 1; display: grid; place-items: center;
    }
    #playbar button:hover { background: #bda4fb; }
    #playbar #play-restart {
      background: transparent; color: #b9bec8; border: 1px solid rgba(255, 255, 255, .2);
    }
    #playbar #play-seek { width: 260px; accent-color: #a78bfa; }
    #hud-time { font-size: 11px; color: #9aa0aa; min-width: 78px; text-align: center; font-variant-numeric: tabular-nums; }

    /* ── 动作配乐选择 ───────────────────────────────── */
    #motion-audio {
      position: fixed; left: 50%; transform: translateX(-50%); bottom: 66px; z-index: 20;
      align-items: center; gap: 8px;
      padding: 5px 12px; border-radius: 999px;
      background: rgba(40, 42, 48, .9); border: 1px solid rgba(255, 255, 255, .14);
      backdrop-filter: blur(8px);
      max-width: min(560px, 86vw);
    }
    #motion-audio .ma-label { font-size: 11px; color: #9aa0aa; flex: none; }
    #motion-audio select {
      background: #2a2c33; color: #e6e8ec; font-size: 11px;
      border: 1px solid rgba(255, 255, 255, .16); border-radius: 6px;
      padding: 3px 6px; max-width: min(420px, 62vw); cursor: pointer;
    }

    /* ── 音频播放器 ─────────────────────────────────── */
    #audio-ui {
      position: fixed; inset: 0; z-index: 15; display: none;
      flex-direction: column; align-items: center; justify-content: center; gap: 22px;
      padding: 40px;
    }
    #audio-name {
      font-size: 15px; font-weight: 600; color: #d8dbe2; text-align: center;
      max-width: 76vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    #audio-wave {
      width: min(680px, 76vw); height: 130px; display: block;
      background: #24262c; border: 1px solid #34363e; border-radius: 10px;
    }
    #audio-controls { display: flex; align-items: center; gap: 14px; }
    #audio-controls button {
      width: 42px; height: 42px; border-radius: 50%; cursor: pointer;
      background: #a78bfa; border: none; color: #1e1f24;
      font-size: 15px; line-height: 1; display: grid; place-items: center;
    }
    #audio-controls button:hover { background: #bda4fb; }
    #audio-restart {
      width: 34px !important; height: 34px !important;
      background: transparent !important; color: #b9bec8 !important;
      border: 1px solid rgba(255, 255, 255, .2) !important;
      font-size: 13px !important;
    }
    #audio-seek { width: min(440px, 52vw); accent-color: #a78bfa; }
    #audio-vol { width: 90px; accent-color: #a78bfa; }
    #audio-time { font-size: 12px; color: #9aa0aa; font-variant-numeric: tabular-nums; min-width: 84px; text-align: center; }

    .hint-line {
      display: none; position: fixed; left: 50%; transform: translateX(-50%);
      bottom: 68px; z-index: 12; pointer-events: none;
      font-size: 11px; color: #8b93a1; text-shadow: 0 1px 4px rgba(0, 0, 0, .7);
    }
  </style>
</head>
<body>
  <div id="host-content"></div>

  <div class="host-title">MMD 动作预览</div>
  <div class="host-sub" id="host-sub">正在加载…</div>
  <div id="hud-status" style="display:none"></div>

  <!-- 3D 播放控制条 -->
  <div id="playbar">
    <button id="play-restart" type="button" title="回到开头">⟲</button>
    <button id="play-toggle" type="button" title="播放 / 暂停">▶</button>
    <input id="play-seek" type="range" min="0" max="1000" value="0" />
    <span id="hud-time">0:00 / 0:00</span>
  </div>
  <!--
    动作同目录的配套音频选择。
    只在「该动作旁边确实有音频」时显示（默认 display:none）。
    只有一个音频时也显示，让用户知道配了哪首曲子。
  -->
  <div id="motion-audio" style="display:none">
    <span class="ma-label">配乐</span>
    <select id="motion-audio-select" title="选择要配合播放的音频"></select>
  </div>
  <div class="hint-line" id="hud-pose-hint">这是一个静态姿势，可拖动旋转查看</div>
  <div class="hint-line" id="hud-camera-hint">相机按镜头数据运动，视角已锁定</div>

  <!-- 音频播放器 -->
  <div id="audio-ui">
    <div id="audio-name">音频</div>
    <canvas id="audio-wave"></canvas>
    <input id="audio-seek" type="range" min="0" max="1000" value="0" />
    <div id="audio-controls">
      <button id="audio-restart" type="button" title="回到开头">⟲</button>
      <button id="audio-play" type="button" title="播放 / 暂停">▶</button>
      <span id="audio-time">0:00 / 0:00</span>
      <input id="audio-vol" type="range" min="0" max="100" value="100" title="音量" />
    </div>
  </div>

  <!-- 居中提示块 -->
  <div id="viewer-hint">
    <div class="box">
      <div id="viewer-hint-title"></div>
      <div id="viewer-hint-body"></div>
    </div>
  </div>

  <div class="host-tips" id="host-tips">左键旋转 · 滚轮缩放 · 右键/中键平移</div>
</body>
</html>
