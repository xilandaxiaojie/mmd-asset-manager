<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <!--
    CSP：asset: 是渲染层唯一的文件读取通道（主程序注册的自定义协议）。
    各指令都要显式放行它，因为 default-src 'self' 不覆盖 asset:：
      img-src     —— 缩略图 / 插件图标
      media-src   —— 视频·音频素材的内嵌播放
      connect-src —— 插件视图用 fetch/XHR 读取素材字节
  -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; img-src 'self' asset: data:; media-src 'self' asset: blob:; connect-src 'self' asset:; style-src 'self' 'unsafe-inline'; script-src 'self'" />
  <title>素材管理器</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div id="app">
    <!-- 顶栏 -->
    <header id="topbar">
      <div class="brand">
        <span class="brand-dot"></span>
        <span class="brand-name">素材管理器</span>
      </div>
      <div class="search-box">
        <svg class="search-icon" viewBox="0 0 16 16" width="14" height="14"><circle cx="7" cy="7" r="5" fill="none" stroke="currentColor" stroke-width="1.6"/><line x1="11" y1="11" x2="14" y2="14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        <input id="search-input" type="text" placeholder="搜索名称 / 路径 / 标签 / 备注…" spellcheck="false" />
      </div>
      <div class="topbar-actions">
        <select id="sort-select" title="排序方式">
          <option value="name">按名称</option>
          <option value="time">按修改时间</option>
          <option value="size">按体积</option>
        </select>
        <button class="btn" id="sort-order-btn" title="切换升降序">↑</button>
        <div class="grid-size-wrap" title="网格大小">
          <span class="grid-size-label">▦</span>
          <input type="range" id="grid-size-slider" min="100" max="320" step="10" value="150" />
        </div>
        <button class="btn" id="view-grid-btn" title="网格视图">▦</button>
        <button class="btn" id="view-list-btn" title="列表视图">☰</button>
        <button class="btn" id="thumb-btn" title="为当前目录内「插件声明可生成缩略图且尚未生成」的素材生成缩略图（已有缩略图的素材会跳过，不会覆盖）">🖼 <span class="btn-label">缩略图</span></button>
        <div class="scan-split" id="scan-split">
          <button class="btn primary scan-main" id="scan-btn" title="增量扫描当前素材库（未变化的素材自动跳过）">↻ 扫描</button>
          <button class="btn primary scan-arrow" id="scan-arrow-btn" title="选择扫描范围">▾</button>
          <div class="scan-menu hidden" id="scan-menu">
            <div class="scan-menu-item" data-scan="current">增量扫描当前目录</div>
            <div class="scan-menu-item" data-scan="all">扫描全部素材库</div>
          </div>
        </div>
      </div>
    </header>

    <!-- 主体 -->
    <div id="main">
      <!-- 左侧栏 -->
      <aside id="sidebar">
        <div class="sidebar-section">
          <div class="section-title">素材库</div>
          <div id="roots-list" class="roots-list"></div>
          <div class="lib-actions">
            <button class="btn small" id="sidebar-add-root">＋ 添加素材库</button>
          </div>
        </div>
        <div class="sidebar-section">
          <div class="section-title">视图</div>
          <div id="quick-views">
            <div class="qv-item active" data-view="all"><span class="qv-ico">🗂</span>全部素材</div>
            <div class="qv-item" data-view="favorites"><span class="qv-ico">★</span>我的收藏</div>
          </div>
        </div>
        <div class="sidebar-section grow">
          <div class="section-title">目录</div>
          <div id="dir-tree" class="dir-tree"></div>
        </div>
        <div class="sidebar-section sidebar-footer">
          <button class="btn" id="settings-btn" title="设置">⚙ 设置</button>
        </div>
      </aside>
      <div id="sidebar-resizer" class="resizer" title="拖动调整左侧栏宽度"></div>

      <!-- 中间内容区 -->
      <section id="content">
        <div id="browse-view">
          <div class="browse-meta">
            <span id="browse-count"></span>
            <span id="current-dir" class="muted"></span>
          </div>
          <div id="folder-view">
            <div id="breadcrumb" class="breadcrumb"></div>
            <div id="folder-section"></div>
            <div id="folder-assets-section"></div>
          </div>
          <div id="asset-grid" class="asset-grid"></div>
          <div id="asset-list" class="asset-list hidden"></div>
          <div id="empty-state" class="hidden">
            <div class="empty-ico">🧩</div>
            <p class="empty-p1">未安装任何插件</p>
            <p class="empty-p2 muted small">当前没有插件声明文件类型，素材库将不会显示任何文件。安装插件后，对应类型的素材即可被索引与浏览。</p>
          </div>
        </div>

        <!-- 设置独立页面 -->
        <div id="settings-view" class="hidden">
          <div class="settings-page-header">
            <h2>设置</h2>
          <div class="settings-page-actions">
            <button class="btn primary hidden" id="settings-save-btn">保存</button>
            <button class="btn" id="settings-close-btn">✕ 关闭</button>
            <button class="btn" id="settings-back-btn">← 返回</button>
          </div>
          </div>
          <div id="settings-page-body"></div>
        </div>

        <!-- 任务进度条区：悬浮在素材浏览器（#content）底部，absolute 不占布局 ——
             每个任务一条（新任务追加在最下面、旧条上移），由渲染层动态创建 -->
        <div id="task-bars"></div>
      </section>
      <div id="detail-resizer" class="resizer" title="拖动调整详情栏宽度"></div>

      <!-- 详情面板：常驻占位（未选中素材时显示占位内容）。
           始终参与布局，开关只换内容不换宽度 —— 否则左侧素材区
           会随之加宽/变窄，点选素材时卡片整体跳位。 -->
      <aside id="detail-panel">
        <div id="detail-head">
          <span id="detail-head-title">详情</span>
          <button id="detail-close" class="detail-close" title="取消选择（Esc）">✕</button>
        </div>
        <div id="detail-content"></div>
      </aside>

      <!-- 批量操作条 -->
      <div id="bulk-bar" class="hidden">
        <span id="bulk-count"></span>
        <div class="bulk-actions">
          <button class="btn small" id="bulk-fav">★ 收藏</button>
          <button class="btn small" id="bulk-unfav">☆ 取消收藏</button>
          <button class="btn small" id="bulk-tags">🏷 批量打标签</button>
          <button class="btn small" id="bulk-close">✕ 关闭</button>
        </div>
      </div>
    </div>

    <!-- 模态框容器 -->
    <div id="modal-root"></div>
  </div>

  <script src="./app.js"></script>
</body>
</html>
